<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do Carro: <input type="number" name="txtvel" id="txtvel"> KM/H
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res"></div>
    <script>
        function calcular() {
         var txtvel = window.document.querySelector('input#txtvel')   
         var res = window.document.querySelector('div#res')
         var vel = Number(txtvel.value)
         res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}</strong> KM/H</p>`
         if (vel  > 60) {
            res.innerHTML += 'Voce esta multado por excesso de velocidade '
         }
         res.innerHTML += 'Dirija sempre com o cinto de segunranca'
        }
    </script>
</body>
</html>
