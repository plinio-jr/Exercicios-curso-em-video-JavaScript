<!DOCTYPE html>
<htm lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pais</title>
</head>
<body>
    <h1>Sistema de paises</h1>
    Digite em que pais voce vive: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="verificar" onclick="checagem()">
    <div id="res"></div>
    <script>
        function checagem() {
            var pais = window.document.querySelector('input#txtpais')
            var res = window.document.querySelector('div#res')
            res.innerHTML = `Voce mora no pais ${pais}`
            if ('pais == Brasil') {
                res.innerHTML = 'Voce é brasileiro'
            } else {
                res.innerHTML = 'Voce é estrangeiro'
        }   
    }
    </script>
</body>
</htm
