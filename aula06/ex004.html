<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = window.prompt("Qual o seu nome: ")
        document.write(`<h2>Olá <strong>${nome}</strong>, seu nome tem ${nome.length} letras</h2><br>`)
        document.write(`Seu nome em letras maiusculas é ${nome.toUpperCase()}<br>`)
        document.write(`Seu nome em letras minusculas é ${nome.toLowerCase()}`)
    </script>
</body>
</html>
